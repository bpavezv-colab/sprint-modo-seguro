  function parseCSV(text) {

        rows.push(row);

  var MAX_ARCHIVO = 2 * 1024 * 1024;
  async function onSubmit(e) {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    const fd = new FormData(f);
    const kind = f.dataset.form;
    const s = store.state;
    if (kind === "col-id") {
      const id = String(fd.get("id") || "").trim().toUpperCase();
      ui.loginStep = { id };
      ui.loginError = "";
      return render();
    }
    if (kind === "col-code") {
      if (String(fd.get("code")).trim() !== "123456") {
        store.rechazarEntrada("ingreso");
        ui.loginError = "El c\xF3digo no es correcto. En la demo es 123456.";
        return render();
      }
      const r = store.login(ui.loginStep?.id);
      if (!r.ok || s.user.rol !== "Colaborador") {
        store.logout();
        ui.loginError = "No encontramos una cuenta de colaborador autorizada.";
        return render();
      }
      ui.loginStep = null;
      ui.loginError = "";
      resetUi();
      return render();
    }
    if (kind === "staff") {
      const r = store.login(String(fd.get("id")), "acceso interno", { soloInterno: true });
      resetUi();
      if (!r.ok) ui.loginError = r.motivo;
      return render();
    }
    if (kind === "discrepancia") {
      const r = store.reportarDiscrepancia(String(fd.get("motivo") || ""));
      if (r.ok) {
        ui.resultado = "con_discrepancia";
        ui.discrepancia = false;
        return render();
      }
      return toastMsg(r.motivo);
    }
    if (kind === "ficha") {
      const op = e.submitter?.value === "enviar" ? "enviar" : "guardar";
      const campos = Object.fromEntries(["tarea_1", "tarea_2", "tarea_3", "companero_id", "reunion_at"].map((k) => [k, String(fd.get(k) || "")]));
      const r = op === "enviar" ? store.enviarFicha(f.dataset.arg, campos) : store.guardarFicha(f.dataset.arg, campos);
      if (!r.ok) {
        ui.fichaErrores = r.faltan || [r.motivo];
        render();
        return toastMsg(r.motivo);
      }
      ui.fichaErrores = null;
      return toastMsg(op === "enviar" ? `Ficha enviada. ${r.aviso}` : `Borrador guardado: ${ESTADOS_FICHA[r.estado]}.`);
    }
    if (kind === "ti-pendiente") {
      const r = store.marcarPendiente(f.dataset.arg, String(fd.get("fecha") || ""));
      return toastMsg(r.ok ? "Fecha comprometida guardada." : r.motivo);
    }
    if (kind === "reporte") {
      const r = store.reportar(String(fd.get("tipo")));
      return toastMsg(r.ok ? "Solicitud creada en esta demo para revisi\xF3n de Personas. Se borra al recargar." : r.motivo);
    }
    if (kind === "buscar") {
      const id = String(fd.get("q") || "").trim().toUpperCase();
      if (!id) return;
      const c = store.verColaborador(id);
      ui.busqueda = { id, ok: !!c };
      if (c) ui.detalle = id;
      return render();
    }
    if (kind === "reasignar") {
      ui.confirm = { texto: `Reasignar el hito ${f.dataset.arg} a ${String(fd.get("nuevo"))}. El motivo operativo quedar\xE1 en la bit\xE1cora de esta sesi\xF3n.`, act: "reasignar", arg: f.dataset.arg, nuevo: String(fd.get("nuevo")), motivo: String(fd.get("motivo") || "") };
      return render();
    }
    if (kind === "hoy") {
      const v = String(fd.get("hoy"));
      const r = store.setHoy(v);
      return toastMsg(r.ok ? `Atrasos recalculados al ${fmt(v)}.` : r.motivo);
    }
    if (kind === "carga") {
      const files = [...f.querySelector("input[type=file]").files || []];
      ui.cargaErrores = null;
      if (!files.length) {
        store.rechazarEntrada("carga");
        return toastMsg("Elige al menos un archivo CSV.");
      }
      const nuevo = {};
      const errores = [];
      for (const file of files) {
        const def = ARCHIVOS[file.name.toLowerCase()];
        if (!def) {
          errores.push("Archivo no reconocido; usa los nombres del kit sint\xE9tico");
          continue;
        }
        if (file.size > MAX_ARCHIVO) {
          errores.push(`${file.name}: pesa m\xE1s de 2 MB.`);
          continue;
        }
        let rows;
        try {
          rows = parseCSV(await file.text());
        } catch {
          errores.push(`${file.name}: no se pudo leer como texto UTF-8.`);
          continue;
        }
        const faltan = def[1].filter((c) => !(rows[0] && c in rows[0]));
        if (!rows.length) {
          errores.push(`${file.name}: no tiene filas.`);
          continue;
        }
        if (faltan.length) {
          errores.push(`${file.name}: faltan columnas ${faltan.join(", ")}.`);
          continue;
        }
        nuevo[def[0]] = rows;
      }
      if (errores.length) {
        store.rechazarEntrada("carga");
        ui.cargaErrores = errores;
        return toastMsg("Carga rechazada. Los datos actuales no cambiaron.");
      }
      const r = store.cargarArchivos(nuevo);
      if (!r.ok) {
        ui.cargaErrores = (r.errores || []).slice(0, 30).map((a) => `${a.titulo}: ${a.id} \xB7 ${a.detalle}`);
        return toastMsg(r.motivo);
      }
      if (r.sesionCerrada) {
        resetUi();
        return toastMsg("Archivos cargados solo en memoria. Tu cuenta ya no existe: ingresa de nuevo.");
      }
      ui.tab = "calidad";
      return toastMsg("Archivos sint\xE9ticos cargados solo en memoria. Revisa las alertas de calidad.");
    }
  }
  function resetUi() {
    Object.assign(ui, { fichaAbierta: null, fichaErrores: null, discrepancia: false, resultado: null, denegado: null, tab: "fichas", detalle: null, tiFiltro: "todos", reasignando: null, confirm: null, busqueda: null, exportTexto: null, cargaErrores: null });
  }
  function onClick(e) {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    const arg = b.dataset.arg;
    const s = store.state;
    const h = arg ? s.data.hitos.find((x) => x.hito_id === arg) : null;
    if (["completar", "tomar", "reasignar-open"].includes(act) && !h) {
      toastMsg("Ese hito ya no existe. La vista se actualiz\xF3.");
      return;
    }
    switch (act) {
      case "quick": {
        const r = store.login(arg, "recorrido de demo");
        if (!r.ok) return toastMsg(r.motivo);
        resetUi();
        return render();
      }
      case "logout":
        store.logout();
        resetUi();
        ui.loginStep = null;
        return render();
      case "login-back":
        ui.loginStep = null;
        ui.loginError = "";
        return render();
      case "tab":
        ui.tab = arg;
        ui.detalle = null;
        ui.reasignando = null;
        ui.exportTexto = null;
        render();
        return window.scrollTo(0, 0);
      case "detalle":
        ui.detalle = ui.detalle === arg ? null : arg;
        ui.reasignando = null;
        return render();
      case "ti-filtro":
        ui.tiFiltro = arg;
        ui.reasignando = null;
        return render();
      case "ficha-filtro":
        ui.fichaFiltro = arg;
        return render();
      case "alerta-filtro":
        ui.alertaFiltro = arg;
        ui.reasignando = null;
        return render();
      case "volver":
        ui.denegado = null;
        return render();
      case "probar-403": {
        const r = store.entrar("/ficha", arg);
        ui.denegado = r.ok ? null : arg;
        render();
        return window.scrollTo(0, 0);
      }
      case "ficha-abrir": {
        if (ui.fichaAbierta === arg) {
          ui.fichaAbierta = null;
          return render();
        }
        const r = store.entrar("/ficha", arg);
        if (!r.ok) {
          ui.denegado = arg;
          return render();
        }
        ui.fichaAbierta = arg;
        ui.fichaErrores = null;
        ui.detalle = null;
        return render();
      }
      case "ficha-confirmar": {
        const r = store.confirmarFicha();
        if (r.ok) {
          ui.resultado = "confirmada";
          return render();
        }
        return toastMsg(r.motivo);
      }
      case "ficha-disc":
        ui.discrepancia = true;
        return render();
      case "ficha-disc-cerrar":
        ui.discrepancia = false;
        return render();
      case "ver-ficha":
        ui.resultado = null;
        return render();
      case "alerta": {
        const r = store.gestionarAlerta(arg, b.dataset.estado);
        return toastMsg(r.ok ? r.aviso || "Alerta marcada como contactada." : r.motivo);
      }
      case "reasignar-open":
        ui.reasignando = arg;
        return render();
      case "reasignar-close":
        ui.reasignando = null;
        return render();
      case "completar":
        ui.confirm = { texto: `Marcar "${NOMBRE_HITO[h.tipo_hito]}" de ${esc(h.colaborador_id)} como cumplido con fecha ${fmt(s.hoy)}. Queda registrado con tu usuario.`, act: "completar", arg };
        return render();
      case "tomar":
        ui.confirm = { texto: `Asignarte el caso ${arg} (${h.tipo_hito} de ${esc(h.colaborador_id)}). La asignaci\xF3n queda en la bit\xE1cora.`, act: "tomar", arg };
        return render();
      case "reset":
        ui.confirm = { texto: "Volver a los datos originales y borrar la bit\xE1cora y los reportes de este navegador.", act: "reset" };
        return render();
      case "cancel":
        ui.confirm = null;
        return render();
      case "confirm-ok": {
        const c = ui.confirm;
        ui.confirm = null;
        if (!c) return;
        if (c.act === "completar") {
          const r = store.completar(c.arg);
          return toastMsg(r.ok ? "Hito marcado como cumplido." : r.motivo);
        }
        if (c.act === "tomar") {
          const r = store.reasignar(c.arg, s.user.usuario_id, `Caso tomado por ${s.user.usuario_id}`, { confirmado: true });
          return toastMsg(r.ok ? "Caso asignado a ti." : r.motivo);
        }
        if (c.act === "reasignar") {
          const r = store.reasignar(c.arg, c.nuevo, c.motivo, { confirmado: true });
          if (r.ok) ui.reasignando = null;
          return toastMsg(r.ok ? "Responsable reasignado y registrado en la bit\xE1cora." : r.motivo);
        }
        if (c.act === "reset") {
          store.reiniciar();
          resetUi();
          return toastMsg("Demo reiniciada.");
        }
        return render();
      }
      case "export": {
        const r = store.exportar(arg);
        if (!r.ok) return toastMsg(r.motivo);
        ui.exportTexto = arg === "bitacora" ? toCSV(r.filas, ["ts", "usuario", "rol", "accion", "objetivo", "detalle", "resultado"]) : toCSV(r.filas);
        render();
        const t = ui.exportTexto;
        try {
          navigator.clipboard.writeText(t).then(() => toastMsg("CSV copiado al portapapeles."), () => selExport());
        } catch {
          selExport();
        }
        return void 0;
      }
      default:
        return void 0;
    }
  }
  function selExport() {
    const t = root.querySelector("#exp");

      t.focus();
      t.select();
    }
    toastMsg("Selecciona y copia el CSV del recuadro.");
  }
  function onChange(e) {
    const el = e.target.closest("[data-change]");
    if (!el) return;
    if (el.dataset.change === "rep-estado") {
      const r = store.cambiarEstadoReporte(el.dataset.arg, el.value);
      toastMsg(r.ok ? "Estado actualizado." : r.motivo);
    }
  }
  function onToggle(e) {
    const d = e.target;
    if (d.matches && d.matches("details[data-regla]")) ui.alertaAbierta = d.open ? d.dataset.regla : ui.alertaAbierta === d.dataset.regla ? null : ui.alertaAbierta;
  }
  function fallo(contexto, err) {
    console.error(err);
    try {
      store.registrarError(contexto, err && err.message);
    } catch {
    }
    ui.confirm = null;
    ui.toast = "No se pudo completar la acci\xF3n. Qued\xF3 registrado en la bit\xE1cora.";
    try {
      render();
    } catch {
      root.textContent = "Error al dibujar la p\xE1gina. Recarga para continuar.";
    }
  }
  var seguro = (nombre, fn) => (e) => {
    try {
      const r = fn(e);
      return r && typeof r.catch === "function" ? r.catch((err) => fallo(nombre, err)) : r;
    } catch (err) {
      fallo(nombre, err);
    }
  };
  function mount(el, st) {
    root = el;
    store = st;
    root.addEventListener("click", seguro("clic", onClick));
    root.addEventListener("submit", seguro("formulario", onSubmit));
    root.addEventListener("change", seguro("cambio", onChange));
    root.addEventListener("toggle", seguro("detalle", onToggle), true);
    globalThis.window?.addEventListener("error", (e) => fallo("global", e.error || new Error(e.message)));
    globalThis.window?.addEventListener("unhandledrejection", (e) => fallo("promesa", e.reason instanceof Error ? e.reason : new Error(String(e.reason))));
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && ui.confirm) {
        ui.confirm = null;
        render();
      }
    });
    render();
