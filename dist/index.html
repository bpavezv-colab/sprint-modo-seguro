<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Sprint Onboarding Seguro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/* Layout: barra superior flotante + columna lateral fija con la navegación de la vista + contenido en bloques separados por líneas finas. */
:root {
  --bg: #e9edef; --surface: #f4f6f7; --ink: #262933; --ink-60: rgba(38, 41, 51, .62); --ink-40: rgba(38, 41, 51, .42);
  --line: rgba(38, 41, 51, .18); --sky: #c5f0f7; --sky-ink: #262933; --maroon: #911a46; --white: #ffffff;
  --ok: #1f6b4a; --warn: #8a5a00; --bad: #911a46; --ok-bg: rgba(31, 107, 74, .12); --warn-bg: rgba(138, 90, 0, .12); --bad-bg: rgba(145, 26, 70, .10);
  --dlg-bg: #262933; --dlg-ink: #ffffff;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.86, 0, .27, .98);
  --gut: clamp(1.25rem, 5vw, 4.5rem);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1e24; --surface: #22262d; --ink: #e9edef; --ink-60: rgba(233, 237, 239, .64); --ink-40: rgba(233, 237, 239, .42);
  --line: rgba(233, 237, 239, .16); --sky: #c5f0f7; --sky-ink: #262933; --maroon: #f07fa6; --white: #ffffff;
  --ok: #6fd3a6; --warn: #f1c56b; --bad: #f07fa6; --ok-bg: rgba(111, 211, 166, .12); --warn-bg: rgba(241, 197, 107, .12); --bad-bg: rgba(240, 127, 166, .12);
  --dlg-bg: #e9edef; --dlg-ink: #262933; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b1e24; --surface: #22262d; --ink: #e9edef; --ink-60: rgba(233, 237, 239, .64); --ink-40: rgba(233, 237, 239, .42);
  --line: rgba(233, 237, 239, .16); --sky: #c5f0f7; --sky-ink: #262933; --maroon: #f07fa6; --white: #ffffff;
  --ok: #6fd3a6; --warn: #f1c56b; --bad: #f07fa6; --ok-bg: rgba(111, 211, 166, .12); --warn-bg: rgba(241, 197, 107, .12); --bad-bg: rgba(240, 127, 166, .12);
  --dlg-bg: #e9edef; --dlg-ink: #262933; color-scheme: dark }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-weight: 500; letter-spacing: -.02em; text-wrap: balance; line-height: 1.05; }
h1 { font-size: clamp(2rem, 4.4vw, 4rem); max-width: 20ch; }
.h-lg { font-size: clamp(1.6rem, 3.2vw, 2.8rem); max-width: 22ch; }
.h-md { font-size: 1.5rem; margin-bottom: 1.25rem; }
code { font-family: var(--mono); font-size: .8em; color: var(--ink-60); }
.caption { font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; }
.dim { color: var(--ink-60); }
.num { font-variant-numeric: tabular-nums; }
.lead { color: var(--ink-60); max-width: 52ch; font-size: 1.05rem; }
.hint { color: var(--ink-60); font-size: .85rem; max-width: 60ch; }
.missing { color: var(--warn); font-style: italic; }
.err { color: var(--bad); margin-bottom: 1rem; }
.empty { color: var(--ink-60); }
.nw { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid #4d65ff; outline-offset: 2px; }
.stack { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.row-end { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.tone-bad { color: var(--bad); } .tone-warn { color: var(--warn); } .tone-ok { color: var(--ok); }

/* barra superior */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  padding-top: calc(1rem + env(safe-area-inset-top, 0px)); padding-bottom: 1rem;
  padding-left: max(1.5rem, env(safe-area-inset-left, 0px)); padding-right: max(1.5rem, env(safe-area-inset-right, 0px)); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.logo { display: flex; align-items: center; gap: .6rem; }
.logo-mark { width: 1.35rem; height: 1.35rem; border: 1px solid var(--ink); position: relative; }
.logo-mark::after { content: ""; position: absolute; inset: 35% 0 0 35%; background: var(--sky); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
.logo-txt { font-weight: 500; font-size: 1.1rem; letter-spacing: -.01em; }
.logo-sub { color: var(--ink-60); }
@media (max-width: 1280px) { .logo-sub { display: none; } }
body:has(.cta) main { padding-bottom: 5rem; }
.topnav { display: flex; border: 1px solid var(--line); background: var(--bg); }
.topnav > * { padding: .6rem 1rem; white-space: nowrap; }
.topnav > * + * { border-left: 1px solid var(--line); }
.topnav button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink); background: none; border: 0; border-left: 1px solid var(--line); cursor: pointer; position: relative; z-index: 0; transition: color .3s; }
.topnav button::after, .btn::after, .row-btn::after { content: ""; position: absolute; inset: auto 0 0 0; height: 0; background: var(--ink); z-index: -1; transition: height .6s var(--ease); }
.topnav button:hover { color: var(--bg); }
.topnav button:hover::after, .btn:hover::after { height: 100%; }
.tn-cut, .tn-who { color: var(--ink-60); }

/* esqueleto */
.layout { display: grid; grid-template-columns: minmax(14rem, 19rem) 1fr; min-height: 100vh; }
.layout.no-side { grid-template-columns: 1fr; }
.sidebar { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); padding: 5.5rem 1.5rem 1.5rem; display: flex; flex-direction: column; gap: 2rem; overflow-y: auto; }
.sidebar nav { display: flex; flex-direction: column; }
.sidebar nav a, .sidebar nav button, .mnav a, .mnav button { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem 0; border: 0; border-bottom: 1px solid var(--line); color: var(--ink-40); background: none; font: inherit; letter-spacing: inherit; text-transform: inherit; text-align: left; cursor: pointer; text-decoration: none; transition: color .3s; }
.sidebar nav a:hover, .sidebar nav button:hover, .sidebar nav .active, .mnav .active { color: var(--ink); }
.sidebar nav .sub { padding-left: 1rem; }
.sidebar nav em, .mnav em { font-style: normal; margin-right: .8rem; }
.mark { margin-top: auto; display: flex; flex-direction: column; gap: .25rem; color: var(--ink-40); }
.mark b { color: var(--ink); font-weight: 500; }
main { min-width: 0; padding-top: 4.5rem; }
.layout.no-side main { padding-top: 4.5rem; }
.mnav { display: none; }

/* bloques */
.blk { border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 1.75rem; scroll-margin-top: 4rem;
  padding-block: 3.5rem; padding-left: max(var(--gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--gut), env(safe-area-inset-right, 0px)); }
.blk-tight { padding-block: 1.25rem; }
.hero { padding-block: 4rem 3.5rem; gap: 2rem; }
.hero-sm { padding-block: 3rem 2.5rem; }
.tags { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; color: var(--ink-60); }
.detail { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
.detail > * { min-width: 0; }
.big-num { font-size: clamp(3.5rem, 8vw, 6.5rem); line-height: .9; font-weight: 500; letter-spacing: -.04em; }

/* cifras en filas */
.stats { display: flex; flex-direction: column; font-size: .8rem; letter-spacing: .03em; text-transform: uppercase; }
.stats > div { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .8rem 0; border-top: 1px solid var(--line); }
.stats > div:last-child { border-bottom: 1px solid var(--line); }
.stats > div > span:first-child { color: var(--ink-60); }
.stats > div > span:last-child { text-align: right; display: flex; align-items: center; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; }
.stats .missing { text-transform: none; letter-spacing: 0; }

/* filas de lista */
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { border-top: 1px solid var(--line); }
.rows > li:last-child { border-bottom: 1px solid var(--line); }
.hrow { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 0; flex-wrap: wrap; }
.rb-main { display: flex; flex-direction: column; gap: .2rem; min-width: 0; flex: 1 1 16rem; }
.rb-main b { font-weight: 500; font-size: 1.05rem; }
.rb-main .dim, .rb-main .missing { font-size: .88rem; }
.hrow-ok .rb-main b { color: var(--ink-60); }
.hrow-bad { box-shadow: inset 3px 0 0 var(--bad); padding-left: 1rem; }
.hrow-warn { box-shadow: inset 3px 0 0 var(--warn); padding-left: 1rem; }
.row-btn { width: 100%; display: flex; align-items: center; gap: 1.5rem; padding: 1.1rem 0; background: none; border: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; position: relative; z-index: 0; transition: color .3s, padding .4s var(--ease); }
.row-btn:hover { color: var(--bg); padding-left: 1rem; padding-right: 1rem; }
.row-btn:hover::after { height: 100%; }
.row-btn:hover .dim, .row-btn:hover code { color: inherit; opacity: .7; }
.row-btn .idx { color: var(--ink-40); min-width: 1.5rem; }
.plus-ico { width: .9rem; height: .9rem; flex: none; background: linear-gradient(currentColor, currentColor) center / 100% 1px no-repeat, linear-gradient(currentColor, currentColor) center / 1px 100% no-repeat; transition: transform .4s var(--ease); }
.row-btn:hover .plus-ico { transform: rotate(90deg); }

/* botones */
.btn { position: relative; z-index: 0; display: inline-flex; align-items: center; gap: .8rem; padding: .8rem 1.2rem; border: 1px solid var(--ink); background: var(--sky); color: var(--sky-ink); font: inherit; font-size: .8rem; letter-spacing: .02em; cursor: pointer; text-decoration: none; transition: color .3s; white-space: nowrap; }
.btn:hover { color: var(--bg); }
.btn-primary::before { content: ""; width: .7rem; height: .7rem; flex: none; background: linear-gradient(currentColor, currentColor) center / 100% 1px no-repeat, linear-gradient(currentColor, currentColor) center / 1px 100% no-repeat; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--ink); }
.btn-sm { padding: .5rem .8rem; font-size: .75rem; gap: .5rem; }
.btn-sm.btn-primary::before { width: .55rem; height: .55rem; }
.link { background: none; border: 0; padding: 0; font: inherit; color: inherit; border-bottom: 1px solid currentColor; cursor: pointer; }
.cta { position: fixed; z-index: 20; right: calc(1.5rem + env(safe-area-inset-right, 0px)); bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); }

/* formularios */
.form { display: grid; gap: 1.5rem; max-width: 34rem; }
.form-inline { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1.5rem; max-width: none; }
.form-inline .field { flex: 1 1 14rem; }
.field { display: grid; gap: .35rem; border-bottom: 1px solid var(--ink); }
.field label { font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; }
.field input, .field select, .field textarea { background: none; border: 0; font: inherit; color: inherit; padding: .5rem 0; resize: vertical; min-width: 0; max-width: 100%; border-radius: 0; }
.field input::placeholder, .field textarea::placeholder { color: var(--ink-40); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; }
.field:focus-within { border-bottom-color: #4d65ff; }
.field-sm { border-bottom-color: var(--line); }
.field select option { color: #262933; background: #ffffff; }

/* estado */
.chip { display: inline-block; font-size: .7rem; letter-spacing: .04em; text-transform: uppercase; padding: .2rem .55rem; border: 1px solid currentColor; white-space: nowrap; }
.chip-ok { color: var(--ok); background: var(--ok-bg); }
.chip-warn { color: var(--warn); background: var(--warn-bg); }
.chip-bad { color: var(--bad); background: var(--bad-bg); }
.chip-neutral { color: var(--ink-60); }
.dot { display: inline-block; width: .55rem; height: .55rem; vertical-align: middle; }
.dot-rojo { background: var(--bad); } .dot-amarillo { background: var(--warn); } .dot-verde { background: var(--ok); } .dot-gris { border: 1px solid var(--ink-40); }
.bar { height: 3px; background: var(--line); min-width: 60px; width: 100%; max-width: 9rem; }
.bar span { display: block; height: 100%; background: var(--ink); }
.bar-lg { height: 6px; max-width: none; flex: 1; }
.bar-bad span { background: var(--bad); }
.notice { border: 1px solid var(--line); padding: .9rem 1rem; font-size: .92rem; max-width: 70ch; }
.notice-bad { border-color: var(--bad); color: var(--ink); background: var(--bad-bg); }

/* tablas */
.table-wrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .8rem .75rem .8rem 0; border-top: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 1px solid var(--line); }
thead th { font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-60); font-weight: 400; white-space: nowrap; border-top: 0; }
tbody th { font-weight: 500; }
tr.sub > td { background: var(--surface); padding: 1rem; }
table.inner th, table.inner td { padding-left: .5rem; }
.heatmap td.heat { text-align: center; background: color-mix(in srgb, var(--sky) calc(var(--p) * 1%), transparent); color: var(--ink); }
:root[data-theme="dark"] .heatmap td.heat { color: var(--ink); }
.heatmap th { text-align: center; } .heatmap tbody th { text-align: left; }

.metric-rows { display: flex; flex-direction: column; }
.metric { display: grid; grid-template-columns: minmax(7rem, 11rem) 1fr 3rem 4.5rem; gap: 1rem; align-items: center; padding: .8rem 0; border-top: 1px solid var(--line); }
.metric:last-child { border-bottom: 1px solid var(--line); }
.metric b { font-weight: 500; text-align: right; }

/* acordeón de alertas */
.acc details { border-top: 1px solid var(--line); }
.acc details:last-child { border-bottom: 1px solid var(--line); }
.acc summary { list-style: none; display: grid; grid-template-columns: 4rem 1fr auto 1.4rem; gap: 1.25rem; align-items: center; padding: 1.1rem 0; cursor: pointer; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "+"; font-size: 1.4rem; line-height: 1; transition: transform .4s var(--ease); justify-self: end; }
.acc details[open] summary::after { transform: rotate(45deg); }
.acc .sev { color: var(--ink-60); }
.alert-alta .sev { color: var(--bad); } .alert-media .sev { color: var(--warn); }
.acc-t { font-size: 1.1rem; }
.acc .count { font-size: 1.4rem; font-weight: 500; }
.acc-body { padding: 0 0 1.5rem 5.25rem; display: flex; flex-direction: column; gap: .8rem; }
.mini { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: .3rem; font-size: .88rem; max-height: 18rem; overflow: auto; }

/* diálogo y aviso flotante */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(38, 41, 51, .6); display: grid; place-items: center; padding: 1rem; }
.dialog { position: relative; width: min(36rem, 100%); padding: 2.5rem; background: var(--dlg-bg); color: var(--dlg-ink); display: flex; flex-direction: column; gap: 1.25rem; }
.dialog h2 { font-size: 2rem; }
.dialog p { opacity: .8; }
.dialog .close { position: absolute; top: 1rem; right: 1rem; background: none; border: 0; color: inherit; font: inherit; letter-spacing: .04em; cursor: pointer; }
.btn-inv { color: var(--dlg-ink); border-color: currentColor; }
.btn-inv::after, .btn-light::after { background: var(--dlg-ink); }
.btn-inv:hover, .btn-light:hover { color: var(--dlg-bg); }
.btn-light { background: var(--sky); color: var(--sky-ink); border-color: var(--sky); }
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); background: var(--dlg-bg); color: var(--dlg-ink); padding: .8rem 1.2rem; font-size: .9rem; max-width: calc(100% - 2rem); }
.export { width: 100%; font-family: var(--mono); font-size: .75rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: .75rem; }

@media (max-width: 991px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .mnav { display: flex; gap: 1.25rem; overflow-x: auto; border-bottom: 1px solid var(--line);
    padding-left: max(var(--gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--gut), env(safe-area-inset-right, 0px)); }
  .mnav a, .mnav button { flex: none; border-bottom: 2px solid transparent; }
  .mnav .active { border-bottom-color: var(--ink); }
  .detail { grid-template-columns: 1fr; gap: 2rem; }
  .tn-cut, .logo-sub { display: none; }
  .blk { padding-block: 2.5rem; }
  .hero { padding-block: 2.5rem 2.25rem; }
  .acc-body { padding-left: 0; }
}
@media (max-width: 560px) {
  .tn-who { display: none; }
  .topbar { background: var(--bg); border-bottom: 1px solid var(--line); padding-top: calc(.6rem + env(safe-area-inset-top, 0px)); padding-bottom: .6rem; }
  .topnav > * { padding: .5rem .75rem; }
  .metric { grid-template-columns: 1fr 3rem; }
  .metric .bar { grid-column: 1 / -1; grid-row: 2; }
  .metric small { display: none; }
  .acc summary { grid-template-columns: 1fr auto 1.2rem; }
  .acc .sev { grid-column: 1 / -1; }
  .row-btn { gap: 1rem; }
  .row-btn code { display: none; }
}
/* ---------- Ficha de Ingreso ---------- */
.filters { display: flex; gap: 1.5rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.filters button { background: none; border: 0; border-bottom: 2px solid transparent; padding: .6rem 0; margin-bottom: -1px; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink-40); cursor: pointer; transition: color .3s; }
.filters button:hover, .filters button.on { color: var(--ink); }
.filters button.on { border-bottom-color: var(--ink); }
.sub-panel { background: var(--surface); padding: 1.5rem; margin-bottom: 1rem; }
.tareas .hrow { justify-content: flex-start; gap: 1.25rem; }
.tareas .idx { color: var(--ink-40); min-width: 1.5rem; }
fieldset.choice { border: 0; border-bottom: 1px solid var(--ink); padding: 0 0 .5rem; margin: 0; display: grid; gap: .25rem; }
fieldset.choice legend { padding: 0 0 .5rem; }
.radio { display: flex; gap: .75rem; align-items: center; min-height: 44px; cursor: pointer; }
.radio input { width: 1.1rem; height: 1.1rem; accent-color: var(--ink); }
.ti-fecha { display: flex; gap: .5rem; align-items: flex-end; flex-wrap: wrap; }
.ti-fecha .field { min-width: 9rem; }
.ficha-form { max-width: 40rem; }
@media (max-width: 991px) { .btn { min-height: 44px; } .sub-panel { padding: 1rem; } }

/* ---------- Avisos de la jefatura ---------- */
.tn-avisos { color: var(--ink-60); text-decoration: none; display: inline-flex; gap: .5rem; align-items: center; }
.tn-avisos.on { color: var(--ink); background: var(--sky); }
.tn-avisos b { font-weight: 500; }
.aviso { justify-content: flex-start; }
.aviso > .chip { flex: none; min-width: 10.5rem; text-align: center; }
.aviso > .row { margin-left: auto; }
.aviso.visto { opacity: .6; }
@media (max-width: 560px) { .aviso > .chip { min-width: 0; } }

/* Planificación semanal: misma tipografía y tokens que el resto del MVP. */
.turnos-wide { max-width: none; margin-block: 1.5rem; }
.turnos-wide fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 1.25rem; min-width: 0; }
.turnos-wide fieldset:disabled { opacity: .6; }
.turnos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1.5rem; margin-block: 1rem; }
.turnos-steps { display: flex; flex-wrap: wrap; list-style: none; padding: 0; gap: .75rem 1.5rem; margin-block: 2rem; color: var(--ink-60); font-size: .8rem; }
.turnos-steps li { padding-bottom: .5rem; border-bottom: 1px solid var(--line); }
.turnos-config { border-block: 1px solid var(--line); padding-block: 1rem; margin-block: 1.5rem; }
.turnos-config summary, #turnos-demanda summary, #turnos-resultados summary { cursor: pointer; font-weight: 500; }
.turnos-check { display: flex; align-items: flex-start; gap: .75rem; font-size: .9rem; }
.turnos-check input { accent-color: var(--ink); margin-top: .3rem; }
.turnos-demand { min-width: 40rem; }
.turnos-demand input { width: 5rem; padding: .7rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); font: inherit; }
.turnos-demand input:focus { outline: 2px solid var(--sky-ink); outline-offset: 2px; }
.turnos-toolbar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin-block: 1.5rem; }
.turnos-priorities { display: grid; margin-block: 2rem; }
.turnos-priority { display: grid; grid-template-columns: 2rem 1fr 5rem; align-items: start; gap: 1rem; padding-block: 1.5rem; border-bottom: 1px solid var(--line); }

  async function submitTurnos(kind, fd, { store: store2, ui: ui2, render: render2, toast }) {
    const st = estadoUI(store2, ui2);
    if (kind === "turnos-abrir") {
      const week = String(fd.get("week") || "");
      const p2 = store2.planTurnos(week);
      if (!p2) return toast("No hay una semana preparada con esa fecha en tu sesi\xF3n. Prepara primero el escenario.");
      st.week = week;
      st.selected = null;
      st.compare = "original";
      return render2();
    }
    if (kind === "turnos-preparar") {
      const settings = {
        mode: String(fd.get("mode")),
        morningStart: minutos(fd.get("morningStart")),
        morningEnd: minutos(fd.get("morningEnd")),
        afternoonStart: minutos(fd.get("afternoonStart")),
        afternoonEnd: minutos(fd.get("afternoonEnd")),
        lockFirst: fd.get("lockFirst") === "on",
        validated: fd.get("validated") === "on"
      };
      for (const k of ["targetHours", "maxHours", "maxDays", "maxDailyHours", "minRestHours", "maxConsecutiveDays"]) settings[k] = fd.get(k) === "" || fd.get(k) === null ? NaN : Number(fd.get(k));
      const week = String(fd.get("week") || "");
      if (store2.planTurnos(week)) {
        ui2.confirm = { act: "turnos-preparar", week, settings, texto: "Reemplazar el escenario de esta semana, incluidos demanda y propuestas de demostraci\xF3n. Los turnos oficiales no cambian." };
        return render2();
      }
      const r = store2.prepararTurnos(week, settings);
      if (r.ok) {
        st.week = week;
        st.selected = null;
      }
      return toast(r.ok ? "Semana de demostraci\xF3n preparada. Revisa y guarda la demanda." : r.motivo);
    }
    const p = store2.planTurnos(st.week);
    if (!p) return toast("Prepara una semana autorizada antes de continuar.");
    if (kind === "turnos-demanda") {
      const demand = p.model.demand.map((d, i) => ({ ...d, required: fd.get(`d-${i}`) === "" || fd.get(`d-${i}`) === null ? NaN : Number(fd.get(`d-${i}`)) }));
      const r = store2.guardarDemandaTurnos(st.week, demand);
      return toast(r.ok ? "Borrador guardado en memoria. Confirma la demanda antes de optimizar." : r.motivo);
    }
    if (kind === "turnos-excepcion") {
      const r = store2.solicitarExcepcionTurnos(st.week, String(fd.get("reason")));
      return toast(r.ok ? "Solicitud registrada. Personas debe autorizarla desde su vista." : r.motivo);
    }
    if (kind === "turnos-generar") {
      for (const k of Object.keys(SEARCH_DEFAULT)) st.search[k] = fd.get(k) === "" || fd.get(k) === null ? NaN : Number(fd.get(k));
      for (const k of ORDEN_DEFAULT) st.tolerances[k] = fd.get(`tol-${k}`) === "" || fd.get(`tol-${k}`) === null ? NaN : Number(fd.get(`tol-${k}`));
      const owner = store2.state.user.usuario_id;
      const work = store2.generarTurnos(st.week, st.order, { ...st.search, tolerances: st.tolerances, onProgress: () => render2() });
      render2();
      const r = await work;
      if (store2.state.user?.usuario_id !== owner) return render2();
      if (r.ok) {
        st.selected = r.id;
        st.compare = "original";
      }
      return toast(r.ok ? "Propuesta factible generada. Revisa los faltantes y comp\xE1rala antes de aprobar." : r.motivo);
    }
  }

  function confirmarTurnos(c, { store: store2, ui: ui2, render: render2, toast }) {

  function changeTurnos(el, { store: store2, ui: ui2, render: render2 }) {
    const st = estadoUI(store2, ui2);

    if (el.dataset.change === "turnos-comparar") st.compare = el.value;
    return render2();
  }

      const campos = Object.fromEntries(["tarea_1", "tarea_2", "tarea_3", "companero_id", "reunion_at"].map((k) => [k, String(fd.get(k) || "")]));
      const r = op === "enviar" ? store.enviarFicha(f.dataset.arg, campos) : store.guardarFicha(f.dataset.arg, campos);

    }
    if (kind === "ind-reprogramar") {
      const r = store.pedirReprogramacion(String(fd.get("motivo") || ""));
      if (r.ok) ui.indReprogramar = false;
      return toastMsg(r.ok ? "Pediste otro horario. Personas te ofrecer\xE1 una nueva sesi\xF3n." : r.motivo);
    }
    if (kind === "ti-pendiente") {
      const r = store.marcarPendiente(f.dataset.arg, String(fd.get("fecha") || ""));
      return toastMsg(r.ok ? "Fecha comprometida guardada." : r.motivo);
    }

    if (kind === "buscar") {

        return toastMsg("Elige al menos un archivo CSV.");

      const nuevo = {};

        if (file.size > MAX_ARCHIVO) {

          errores.push(`${file.name}: no se pudo leer como texto UTF-8.`);
          continue;

        const faltan = def[1].filter((c) => !(rows[0] && c in rows[0]));

      }

      return toastMsg("Archivos sint\xE9ticos cargados solo en memoria. Revisa las alertas de calidad.");
