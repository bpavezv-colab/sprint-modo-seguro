<style>/* Layout: app de trabajo. Barra superior de identidad, contenido en columna de 1120px; la vista del colaborador se estrecha a un teléfono. */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --brand: #8f96ff; --brand-ink: #11122a; --accent: #ff9a3c; --accent-ink: #ffb46b;
  --ok: #5fd39b; --ok-bg: #173a2c; --warn: #f2c063; --warn-bg: #3a2f17; --bad: #ff8a80; --bad-bg: #44201e; --neutral-bg: #262a50; color-scheme: dark } }
:root[data-theme="dark"] {

  --brand: #8f96ff; --brand-ink: #11122a; --accent: #ff9a3c; --accent-ink: #ffb46b;
  --ok: #5fd39b; --ok-bg: #173a2c; --warn: #f2c063; --warn-bg: #3a2f17; --bad: #ff8a80; --bad-bg: #44201e; --neutral-bg: #262a50; color-scheme: dark }

* { box-sizing: border-box; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* barra superior */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
@media (min-width: 760px) { .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; } }
.top-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.who { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* controles */

.link { background: none; border: 0; color: var(--brand); text-decoration: underline; font: inherit; cursor: pointer; padding: 0; }

.chip-bad { background: var(--bad-bg); color: var(--bad); }

.empty { color: var(--muted); font-style: italic; }

.badge-soft { background: var(--bad-bg); color: var(--bad); }

.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 2px; }

.kpi span { color: var(--muted); font-size: .85rem; }
.kpi-bad b { color: var(--bad); } .kpi-warn b { color: var(--warn); }

td .row { min-width: 140px; }
.nw { white-space: nowrap; }

.alert .count { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; }
.alert .accion { font-size: .88rem; color: var(--muted); margin-bottom: 8px; }

.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; z-index: 20; padding: 16px; }
.dialog { background: var(--surface); border-radius: 12px; padding: 20px; max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; max-width: calc(100% - 32px); font-weight: 700; font-size: .9rem; }

@media (max-width: 560px) {
  .who-txt { align-items: flex-start; }
  .metric { grid-template-columns: 1fr 44px; }
  .metric .bar { grid-column: 1 / -1; grid-row: 2; }
  .metric small { display: none; }
  .search input { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

        if (!p.ok) {

        const antes = `${h.estado} / ${h.fecha_cumplimiento || "sin fecha"}`;
        patch(hitoId, { estado: "Cumplido", fecha_cumplimiento: s.hoy, ultima_actualizacion: s.hoy });

        const p = s.auth.puedeReasignar(u, h, nuevoId);
        if (!p.ok) {
          log("reasignar", hitoId, p.motivo, "denegado");
          return p;

        const antes = h.responsable_id || "sin responsable";

        s.reportes.unshift(r);

        return { ok: true, id: r.id };
      },
      reportesVisibles() {
        return s.user && s.auth.puedeVerReportes(s.user) ? s.reportes : [];

        return s.user ? s.reportes.filter((r) => r.colaborador_id === s.user.usuario_id) : [];

        if (!s.user || !s.auth.puedeVerReportes(s.user)) return { ok: false, motivo: "Sin permiso" };
        const r = s.reportes.find((x) => x.id === id);

        const antes = r.estado;

        log("reporte_estado", id, `${antes} \u2192 ${estado}`);
        return { ok: true };
      },
      setHoy(iso) {
        if (!s.user || !s.auth.puedeVerCalidad(s.user)) return { ok: false };

        rebuild();

      },
      cargarArchivos(nuevo, resumen) {
        if (!s.user || !s.auth.puedeCargarArchivos(s.user)) return { ok: false, motivo: "Sin permiso" };

      },

        s.overrides = {};
        s.bitacora = [];
        s.reportes = [];

        safeDel();
        rebuild();

      }

      ui.loginStep = { id, canal };
      ui.loginError = "";
      return render();
    }
    if (kind === "col-code") {
      if (String(fd.get("code")).trim() !== "123456") {
        ui.loginError = "El c\xF3digo no es correcto. En la demo es 123456.";
        return render();
      }
      store.login(ui.loginStep.id, `c\xF3digo por ${ui.loginStep.canal || "Personas"}`);
      ui.loginStep = null;
      ui.loginError = "";
      return render();
    }

      store.login(String(fd.get("id")));
      resetUi();
      return render();

      const r = store.reportar(String(fd.get("tipo")), String(fd.get("texto") || ""));

      if (c) ui.detalle = id;
      return render();
    }
    if (kind === "reasignar") {
      const r = store.reasignar(f.dataset.arg, String(fd.get("nuevo")), String(fd.get("motivo") || ""));
